# GitHub Dependabot configuration for Teams.ThirdPartyAppApi
# This file configures Dependabot to automatically check for dependency updates

version: 2
updates:
  # Enable version updates for NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    assignees:
      - "ferenyl"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      nuget:
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    assignees:
      - "ferenyl"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
